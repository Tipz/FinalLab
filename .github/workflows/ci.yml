name: CI and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/tipz/ht6

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: csharp,javascript-typescript
          build-mode: manual
      # A traced build includes generated Razor code and uses the pinned SDK.
      - name: Build for CodeQL extraction
        run: |
          dotnet restore Together.slnx --locked-mode
          dotnet build Together.slnx --configuration Release --no-restore
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          output: codeql-results
          wait-for-processing: true
      # Uploading SARIF alone does not fail the job when findings exist.
      - name: Block on CodeQL findings
        shell: pwsh
        run: .github/scripts/Test-CodeQlResults.ps1 -ResultsPath codeql-results
      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-results
          path: codeql-results/*.sarif
          if-no-files-found: warn
          retention-days: 7

  quality:
    name: Format, audit, Release, xUnit and backend smoke
    needs: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      APP_PORT: 8080
      POSTGRES_PASSWORD: ci-only-password
      SECURE_COOKIES: 'false'
      TOGETHER_IMAGE: ghcr.io/tipz/ht6:ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore Together.slnx --locked-mode
      - name: Verify formatting
        run: dotnet format Together.slnx --verify-no-changes --no-restore
      - name: Audit direct and transitive NuGet dependencies
        shell: pwsh
        run: |
          $report = dotnet package list --project Together.slnx --no-restore --include-transitive --vulnerable --format json
          if ($LASTEXITCODE -ne 0) {
            throw 'NuGet audit command failed.'
          }
          $report
          if ($report -match '"severity"\s*:') {
            throw 'NuGet audit found a vulnerable package. Review the JSON report above.'
          }

      - name: Build without compiler warnings
        run: dotnet build Together.slnx --configuration Release --no-restore
      - name: Run Core and UI tests
        run: dotnet test tests/Together.Tests/Together.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults/Core
      - name: Run API integration tests
        run: dotnet test tests/Together.Api.Tests/Together.Api.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults/Api
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 7

      - name: Validate deployment Compose file
        run: docker compose --file docker-compose.deploy.yml config --quiet
      - name: Install Chromium
        shell: pwsh
        run: tests/Together.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Start application stack and wait for readiness
        shell: bash
        run: |
          docker compose up --build --detach --wait --wait-timeout 180
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://localhost:8080/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Run current backend browser smoke
        env:
          APP_URL: http://localhost:8080
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/browser-evidence
        run: dotnet run --project tests/Together.BrowserTests --configuration Release --no-build -- --backend-smoke
      - name: Collect container logs
        if: always()
        shell: bash
        run: docker compose logs --no-color > "$RUNNER_TEMP/docker-compose.log" 2>&1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-evidence
          path: |
            ${{ runner.temp }}/browser-evidence
            ${{ runner.temp }}/docker-compose.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish immutable multi-platform image
    needs: quality
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Together trip planning application
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
          sbom: true
      - name: Export immutable image reference
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published image (deploy by digest): ${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test published digest
        shell: bash
        env:
          TOGETHER_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          POSTGRES_PASSWORD: ci-only-password
          SECURE_COOKIES: 'false'
        run: |
          docker compose --file docker-compose.deploy.yml up --detach --wait --wait-timeout 180
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/ready > /dev/null; then
              docker compose --file docker-compose.deploy.yml ps
              exit 0
            fi
            sleep 2
          done
          docker compose --file docker-compose.deploy.yml ps
          docker compose --file docker-compose.deploy.yml logs --no-color
          exit 1
      - name: Stop published-image smoke stack
        if: always() && steps.build.outputs.digest != ''
        env:
          TOGETHER_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose --file docker-compose.deploy.yml down --volumes
