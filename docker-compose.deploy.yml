name: together

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-together}
      POSTGRES_USER: ${POSTGRES_USER:-together}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    volumes:
      - together-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    image: ${TOGETHER_IMAGE:?Set TOGETHER_IMAGE to ghcr.io/tipz/together@sha256:...}
    pull_policy: always
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Together: Host=database;Port=5432;Database=${POSTGRES_DB:-together};Username=${POSTGRES_USER:-together};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  app:
    image: ${TOGETHER_IMAGE:?Set TOGETHER_IMAGE to ghcr.io/tipz/together@sha256:...}
    pull_policy: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Together: Host=database;Port=5432;Database=${POSTGRES_DB:-together};Username=${POSTGRES_USER:-together};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
      DataProtection__KeysPath: /app/data-protection
      Authentication__SecureCookies: ${SECURE_COOKIES:-true}
      Authentication__Yandex__ClientId: ${YANDEX_CLIENT_ID:-}
      Authentication__Yandex__ClientSecret: ${YANDEX_CLIENT_SECRET:-}
      YandexMetrika__CounterId: ${YANDEX_METRIKA_COUNTER_ID:-}
      ForwardedHeaders__KnownProxies__0: ${TRUSTED_PROXY_IP:-}
      Security__UseHttpsRedirection: ${USE_HTTPS_REDIRECTION:-false}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - together-data-protection:/app/data-protection
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  together-postgres:
  together-data-protection:
